name: Prepare recovery tables
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/recovery-build.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build-book
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-tables
          path: |
            src/data/glowData.ts
            src/data/reviewColumns.ts
            src/data/privateProfiles.json
            docs/BOOK-REPORT.md
            docs/COST-RECOVERY.md
            docs/RETURN-COVERAGE.md
      - run: npm run build
      - run: npm run test:ingest
      - run: npm run test:family
