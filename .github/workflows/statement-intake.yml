name: Statement intake

# Standard public-repository GitHub runners only. Routine PDF/Excel statements
# publish complete, immutable data views to statement-publications. Data commits
# skip Pages builds. Scans/ZIPs retain the existing full reader and PR gates.
on:
  repository_dispatch:
    types: [statement-intake]
  workflow_dispatch:
  # Resume verified data as soon as its CI completes. The schedule remains a
  # recovery path, rather than adding a polling delay to every clean upload.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, "codex/statement-delivery-*"]
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

# One intake at a time: each reads everything waiting, so a queued run that a
# newer one replaces loses nothing.
concurrency:
  group: statement-intake
  cancel-in-progress: false

jobs:
  intake:
    # Privileged workflow_run jobs always use trusted main code and only accept
    # same-repository delivery branches; fork CI cannot wake this worker.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GLOW_INTAKE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: GitHub publication work waiting?
        id: github_inbox
        env:
          GLOW_GITHUB_TOKEN: ${{ secrets.GLOW_INTAKE_TOKEN || github.token }}
        run: node scripts/ingest/github-statements.mjs --check

      - if: steps.github_inbox.outputs.waiting != '0' || steps.github_inbox.outputs.legacy != '0'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Read and publish routine statements without rebuilding the app
        if: steps.github_inbox.outputs.waiting != '0'
        env:
          GLOW_GITHUB_TOKEN: ${{ secrets.GLOW_INTAKE_TOKEN || github.token }}
          GLOW_PDF_PASSWORDS: ${{ secrets.GLOW_PDF_PASSWORDS }}
          GLOW_DASHBOARD_PASSWORD: ${{ secrets.GLOW_DASHBOARD_PASSWORD }}
        run: node scripts/ingest/github-statements.mjs

      # Check the small inbox log without downloading historical originals.
      # This includes scans/ZIPs handed back by the routine reader in this job.
      - name: Full-reader work remaining?
        id: full_reader
        if: steps.github_inbox.outputs.waiting != '0' || steps.github_inbox.outputs.legacy != '0'
        env:
          GLOW_GITHUB_TOKEN: ${{ secrets.GLOW_INTAKE_TOKEN || github.token }}
        run: node scripts/ingest/github-statements.mjs --check

      - name: Read the remaining uploads through the full publication gates
        if: steps.full_reader.outputs.legacy != '' && steps.full_reader.outputs.legacy != '0'
        env:
          GH_TOKEN: ${{ secrets.GLOW_INTAKE_TOKEN || github.token }}
          GLOW_PDF_PASSWORDS: ${{ secrets.GLOW_PDF_PASSWORDS }}
          GLOW_DASHBOARD_PASSWORD: ${{ secrets.GLOW_DASHBOARD_PASSWORD }}
        run: node scripts/ingest/intake-uploads.mjs
