name: Regenerate (temporary, Bandhan uploads)
on:
  push:
    branches: [fix/bandhan-uploads]
permissions:
  contents: write
jobs:
  regen:
    if: "!contains(github.event.head_commit.message, '[regen]')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr >/dev/null
      - name: Regenerate the archive with the sealed statements opened
        env:
          GLOW_DASHBOARD_PASSWORD: ${{ secrets.GLOW_DASHBOARD_PASSWORD }}
        run: node scripts/dev/regen-bandhan-tmp.mjs
      - name: Commit the regenerated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/audit public/statement-previews docs src/data CLAUDE.md
          git commit -m "Regenerate the archive with the Bandhan uploads opened [regen]" || exit 0
          git push
