name: Statement processor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/statement-processor.yml'
      - 'services/statement-processor/**'
      - 'scripts/**'
      - 'shared/**'
      - 'src/lib/**'
      - 'src/data/glowData.ts'
      - 'src/data/nseSymbols.json'
      - 'source/**'
      - 'public/audit/**'
      - 'public/lookthrough/**'
      - 'config/statement-passwords.bin'
      - 'functions/_middleware.js'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: statement-processor-deployment
  cancel-in-progress: false
jobs:
  deploy:
    # Initial production provisioning, secrets and this activation flag require
    # explicit operator authorization. Merging this workflow never enables it.
    if: vars.GLOW_RAPID_STATEMENTS_ACTIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pin the private image to this verified main commit
        run: node scripts/dev/prepare-rapid-config.mjs
      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 whoami
      - name: Deploy the private processor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 deploy --config .cache/rapid-statement-publications/wrangler.json
