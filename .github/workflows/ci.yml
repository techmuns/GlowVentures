name: CI

# Guards the two things a family-office cockpit cannot regress on: the app must
# build, and the baked book (src/data/glowData.ts) must still be exactly what the
# committed audit archive regenerates — the "regenerates byte-identically from
# source/" guarantee the whole reconciliation rests on. A drift here is how the
# private-markets model and the asset-class split silently fell out of sync.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 1. The app type-checks and builds.
      - name: Build
        run: npm run build

      # 2. The book regenerates BYTE-IDENTICALLY from the committed audit archive.
      #    build-book reads public/audit/ (committed) — no source PDFs or
      #    passwords needed — so a non-empty diff means glowData.ts was hand-edited
      #    or drifted from its archive, which must never happen.
      - name: Book is byte-identical to its archive
        run: |
          npm run build-book
          if ! git diff --quiet -- src/data/glowData.ts src/data/reviewColumns.ts docs/BOOK-REPORT.md; then
            echo "::error::The book or review columns are not byte-identical to their committed sources."
            git --no-pager diff --stat -- src/data/glowData.ts src/data/reviewColumns.ts docs/BOOK-REPORT.md
            exit 1
          fi

      - name: Preserve generated book on a regeneration mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-book
          path: |
            src/data/glowData.ts
            src/data/reviewColumns.ts
            docs/BOOK-REPORT.md

      # 3. The ingest & reconciliation test suites pass (parseNum, layout,
      #    pipeline, and the golden figures a human read off the real statements).
      - name: Ingest tests
        run: npm run test:ingest

      - name: Financial calculations and feed contracts
        run: npm run test:family

      - name: Asset response contracts
        run: node scripts/dev/check-asset-middleware.mjs

      - name: Infinite scrolling and table request budgets
        run: |
          mkdir -p .cache/table-scroll-check
          npm run preview -- --host 127.0.0.1 --port 4173 > .cache/table-scroll-check/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome)" node scripts/dev/check-selected-attribution.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-sector-return-details.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-investment-dates.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-data-performance.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-chunk-recovery.mjs

  # EVERY STATEMENT IN source/ IS READ IN FULL AND REACHES THE BOOK (Stage 10ep).
  # The job above trusts the committed archive; this one re-reads every file in
  # source/ with the committed readers and refuses a PR where:
  #   - a delivery was dropped in without `npm run extract` (the archive differs);
  #   - a reader changed without the archive being regenerated (same);
  #   - any file is not in the archive at all (coverage:source);
  #   - any document is partial, or failed without a recorded reason, or read
  #     but missing from the book or stale in it (check:reads).
  # No passwords and no OCR here: sealed and outlined-text statements are
  # carried forward from the archive a run that could open them wrote.
  statements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Expand every delivery
        run: npm run inventory

      - name: The archive is exactly what source/ and the readers produce
        env:
          GLOW_OCR: "off"
        run: |
          npm run extract
          if [ -n "$(git status --porcelain -- public/audit)" ]; then
            echo "::error::public/audit is not what the committed readers make of source/. Run \`npm run extract\` and \`npm run build-book\` and commit the result."
            git status --short -- public/audit | head -40
            exit 1
          fi

      - name: The book is built from that archive
        run: |
          npm run build-book
          if ! git diff --quiet -- src/data/glowData.ts docs/BOOK-REPORT.md; then
            echo "::error::The book is not what the archive builds. Run \`npm run build-book\` and commit the result."
            git --no-pager diff --stat -- src/data/glowData.ts docs/BOOK-REPORT.md
            exit 1
          fi

      - name: Every file in source/ is accounted for
        run: npm run coverage:source

      - name: Every statement is read in full and reaches the book
        run: npm run check:reads
