name: CI

# Guards the two things a family-office cockpit cannot regress on: the app must
# build, and the baked book (src/data/glowData.ts) must still be exactly what the
# committed audit archive regenerates — the "regenerates byte-identically from
# source/" guarantee the whole reconciliation rests on. A drift here is how the
# private-markets model and the asset-class split silently fell out of sync.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        description: Verified main commit before this statement delivery
        required: true
        type: string

jobs:
  rapid-statements:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Publication and atomic processor contracts
        run: node --test scripts/ingest/__tests__/publication.test.mjs scripts/ingest/__tests__/rapid-processor.test.mjs scripts/ingest/__tests__/rapid-backend.test.mjs
      - name: Validate the private Worker configuration and generated bindings
        run: |
          node scripts/dev/prepare-rapid-config.mjs
          npx --yes wrangler@4.119.0 types .cache/rapid-statement-publications/worker-env.d.ts --config .cache/rapid-statement-publications/wrangler.json
      - name: Real protected statement through the warm engine
        env:
          GLOW_PDF_PASSWORDS: ${{ secrets.GLOW_PDF_PASSWORDS }}
          GLOW_DASHBOARD_PASSWORD: ${{ secrets.GLOW_DASHBOARD_PASSWORD }}
        run: node scripts/dev/benchmark-rapid-statements.mjs
      - name: Prepare the browser application
        run: npm run build
      - name: Real protected drop through Git publication and all dashboard views
        env:
          GLOW_PDF_PASSWORDS: ${{ secrets.GLOW_PDF_PASSWORDS }}
          GLOW_DASHBOARD_PASSWORD: ${{ secrets.GLOW_DASHBOARD_PASSWORD }}
        run: CHROME="$(command -v google-chrome)" node scripts/dev/check-rapid-statements.mjs
      - name: Build the private compute image
        run: docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -f services/statement-processor/Dockerfile -t rapid-statement-check .
      - name: Check the production Node image at one CPU
        env:
          GLOW_PDF_PASSWORDS: ${{ secrets.GLOW_PDF_PASSWORDS }}
          GLOW_DASHBOARD_PASSWORD: ${{ secrets.GLOW_DASHBOARD_PASSWORD }}
        run: |
          docker run --name rapid-statement-check --cpus=1 --env GLOW_PDF_PASSWORDS --env GLOW_DASHBOARD_PASSWORD rapid-statement-check node scripts/dev/benchmark-rapid-statements.mjs
          docker cp rapid-statement-check:/app/.cache/rapid-statement-publications/benchmark.json .cache/rapid-statement-publications/container-benchmark.json
      - name: Preserve speed and complete-book evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapid-statement-publications
          path: |
            .cache/rapid-statement-publications/*.json
            .cache/rapid-statement-publications/browser/*.json
            .cache/rapid-statement-publications/browser/*.png
          if-no-files-found: ignore
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Statement identity, format and publication contracts
        env:
          GLOW_PUBLICATION_BASE: ${{ inputs.baseline || github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm run test:statements
          git fetch --no-tags origin "$GLOW_PUBLICATION_BASE"
          npm run statements:verify -- --base-ref "$GLOW_PUBLICATION_BASE"

      # 2. The book regenerates BYTE-IDENTICALLY from the committed audit archive.
      #    build-book reads public/audit/ (committed) — no source PDFs or
      #    passwords needed — so a non-empty diff means glowData.ts was hand-edited
      #    or drifted from its archive, which must never happen.
      - name: Book is byte-identical to its archive
        id: book_snapshot
        continue-on-error: true
        run: |
          npm run build-book
          if ! git diff --quiet -- src/data/glowData.ts src/data/reviewColumns.ts docs/BOOK-REPORT.md; then
            echo "::error::The book or review columns are not byte-identical to their committed sources."
            git --no-pager diff --stat -- src/data/glowData.ts src/data/reviewColumns.ts docs/BOOK-REPORT.md
            exit 1
          fi

      - name: Preserve generated book on a regeneration mismatch
        if: steps.book_snapshot.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-book
          path: |
            src/data/glowData.ts
            src/data/reviewColumns.ts
            docs/BOOK-REPORT.md

      # Build only after checking the source/book contract. The audit revision
      # must never be prepared from a book that needs regeneration.
      - name: Build
        run: npm run build

      # 3. The ingest & reconciliation test suites pass (parseNum, layout,
      #    pipeline, and the golden figures a human read off the real statements).
      - name: Ingest tests
        run: npm run test:ingest

      - name: Financial calculations and feed contracts
        run: npm run test:family

      - name: Real estate records and ownership calculations
        run: npm run test:real-estate

      - name: Asset response contracts
        run: |
          node scripts/dev/check-asset-middleware.mjs
          node scripts/dev/test-pdf-preview-runtime.mjs
          node --test scripts/dev/test-statement-previews.mjs

      - name: Infinite scrolling and table request budgets
        run: |
          mkdir -p .cache/table-scroll-check
          npm run preview -- --host 127.0.0.1 --port 4173 > .cache/table-scroll-check/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome)" node scripts/dev/check-statement-drop.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-selected-attribution.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-market-returns.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-assumed-holdings.mjs
          BASE=http://127.0.0.1:4173 CHROME="$(command -v google-chrome)" node scripts/check-return-calculations.mjs
          BASE=http://127.0.0.1:4173 CHROME="$(command -v google-chrome)" node scripts/check-latest-account-returns.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-real-estate.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-table-inputs.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-sector-return-details.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-investment-dates.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-publication-refresh.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-data-performance.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-chunk-recovery.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-pdf-preview.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-source-trace.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-navigation-state.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-dashboard-navigation.mjs
          CHROME="$(command -v google-chrome)" node scripts/dev/check-etf-unit-continuity.mjs

      - name: Preserve return attribution browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-attribution-browser
          path: |
            .cache/returns-period/*.png
            .cache/returns-period/browser-results.json
            .cache/market-returns/*.png
            .cache/market-returns/browser-results.json
            .cache/assumed-holdings/browser/*.png
            .cache/assumed-holdings/browser/results.json
          if-no-files-found: ignore

      - name: Preserve real estate browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-estate-browser-check
          path: .cache/real-estate-check
          if-no-files-found: ignore

      - name: Preserve PDF preview browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-preview-browser
          path: .cache/pdf-preview-check
          if-no-files-found: ignore

      - name: Preserve source tracing browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-tracing-browser
          path: .cache/source-trace/browser
          if-no-files-found: ignore

      - name: Preserve navigation state browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-state-browser
          path: |
            .cache/navigation-state-check
            .cache/dashboard-navigation
          if-no-files-found: ignore

      - name: Preserve statement drag-and-drop browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statement-drop-browser
          path: .cache/statement-drop-check
          if-no-files-found: ignore

      - name: Preserve ETF unit continuity browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-unit-continuity-browser
          path: .cache/etf-regression/browser
          if-no-files-found: ignore

      - name: Preserve table correction browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: table-correction-browser
          path: |
            .cache/table-inputs/browser/*.png
            .cache/table-inputs/browser/*results.json
            .cache/table-inputs/browser/failure.json
            .cache/table-inputs/browser/private-original.xlsx
            .cache/table-inputs/browser/property.xlsx
          if-no-files-found: ignore

      # A regeneration mismatch must fail this required job even though the
      # generated candidate is also built/tested to expose independent defects.
      - name: Require the generated book to be committed
        if: always() && steps.book_snapshot.outcome == 'failure'
        run: |
          echo "::error::Commit the verified generated book before merging."
          exit 1

  # EVERY STATEMENT IN source/ IS READ IN FULL AND REACHES THE BOOK (Stage 10ep).
  # The job above trusts the committed archive; this one re-reads every file in
  # source/ with the committed readers and refuses a PR where:
  #   - a delivery was dropped in without `npm run extract` (the archive differs);
  #   - a reader changed without the archive being regenerated (same);
  #   - any file is not in the archive at all (coverage:source);
  #   - any document is partial, or failed without a recorded reason, or read
  #     but missing from the book or stale in it (check:reads).
  # No passwords and no OCR here: sealed and outlined-text statements are
  # carried forward from the archive a run that could open them wrote.
  statements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Expand every delivery
        run: npm run inventory

      - name: The archive is exactly what source/ and the readers produce
        id: archive_snapshot
        continue-on-error: true
        env:
          GLOW_OCR: "off"
        run: |
          npm run extract
          if [ -n "$(git status --porcelain -- public/audit)" ]; then
            echo "::error::public/audit is not what the committed readers make of source/. Run \`npm run extract\` and \`npm run build-book\` and commit the result."
            git status --short -- public/audit | head -40
            exit 1
          fi

      - name: Prepare diagnostic book from a regenerated archive
        if: steps.archive_snapshot.outcome == 'failure'
        run: |
          npm run build-book
          npm run reconcile:review
          npm run coverage:source
          npm run check:reads

      - name: Preserve regenerated archive and book on a mismatch
        if: always() && steps.archive_snapshot.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-source-book
          path: |
            public/audit/
            src/data/glowData.ts
            src/data/reviewColumns.ts
            src/data/reviewGaps.ts
            docs/BOOK-REPORT.md
            docs/COST-RECOVERY.md
            docs/RETURN-COVERAGE.md
            docs/REVIEW-RECONCILIATION.md
            docs/EXTRACTION-REPORT.md
            docs/extraction-report.json
            docs/INGEST-INVENTORY.md
            docs/ingest-inventory.json
            docs/SOURCE-COVERAGE.md

      - name: The book is built from that archive
        run: |
          npm run build-book
          if ! git diff --quiet -- src/data/glowData.ts docs/BOOK-REPORT.md; then
            echo "::error::The book is not what the archive builds. Run \`npm run build-book\` and commit the result."
            git --no-pager diff --stat -- src/data/glowData.ts docs/BOOK-REPORT.md
            exit 1
          fi

      - name: Every file in source/ is accounted for
        run: npm run coverage:source

      - name: Every statement is read in full and reaches the book
        run: npm run check:reads

      - name: Require the generated source archive to be committed
        if: always() && steps.archive_snapshot.outcome == 'failure'
        run: |
          echo "::error::Commit the verified regenerated archive and book before merging."
          exit 1

  upload-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Real drag-and-drop through extraction, publication and dashboard rows
        run: CHROME="$(command -v google-chrome)" npm run test:statement-upload
      - name: Preserve upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statement-upload-e2e
          path: |
            .cache/build-copies/statement-upload-e2e/.cache/statement-upload-e2e/*.json
            .cache/build-copies/statement-upload-e2e/.cache/statement-upload-e2e/*.log
            .cache/build-copies/statement-upload-e2e/.cache/statement-upload-e2e/*.png
            .cache/build-copies/statement-upload-e2e/.cache/investment-date-check/
          if-no-files-found: ignore
